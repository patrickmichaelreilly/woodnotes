<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wood Notes Wild — Notation Player</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfcf8;--ink:#1b1a17;--rule:#b9b2a4;--blue:#3e5f7a;
    --blue-deep:#2b4458;--faded:#6d675c;--wash:#f2efe7;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font:17px/1.6 Georgia,'Times New Roman',serif;
       max-width:1040px;margin:0 auto;padding:2.5rem 1.25rem 7.5rem}
  header{text-align:center;border-bottom:3px double var(--ink);padding-bottom:1.4rem;margin-bottom:1.5rem}
  h1{font-family:'IM Fell English',serif;font-weight:400;font-size:2.4rem;letter-spacing:.02em;margin:0}
  .sub{font-family:'IM Fell English SC',serif;font-size:.95rem;letter-spacing:.28em;color:var(--faded);margin-top:.35rem}
  .credit{font-style:italic;color:var(--faded);font-size:.85rem;margin-top:.6rem}
  button,select,input{font:inherit}
  button{font-family:'IM Fell English SC',serif;letter-spacing:.12em;font-size:.9rem;
         padding:.42rem 1rem;background:var(--blue);color:var(--paper);border:0;cursor:pointer}
  button:hover{background:var(--blue-deep)}
  button:disabled{background:var(--rule);cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .catalog{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:.65rem;
           align-items:end;margin-bottom:1.4rem}
  .catalog label{display:flex;flex-direction:column;gap:.2rem;font-family:'IM Fell English SC',serif;
                 letter-spacing:.08em;font-size:.78rem;color:var(--faded)}
  .catalog input,.catalog select{border:1px solid var(--rule);background:var(--paper);padding:.45rem .55rem}
  .nav{display:flex;gap:.4rem}
  .catalog-count{font:0.8rem var(--mono);color:var(--faded);padding:.45rem 0}

  .layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:1.5rem;align-items:start}
  .source{background:var(--wash);border:1px solid var(--rule);padding:.8rem;min-height:180px}
  .source h2,.fig h2{font-family:'IM Fell English',serif;font-weight:400;margin:0}
  .source-head{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;margin-bottom:.65rem}
  .source-count{font:.75rem var(--mono);color:var(--faded)}
  .crop-list{display:grid;gap:.75rem}
  .crop-list figure{margin:0}
  .crop-list img{display:block;width:100%;height:auto;background:white;border:1px solid var(--rule)}
  .crop-list figcaption{font:.7rem var(--mono);color:var(--faded);margin-top:.2rem;overflow-wrap:anywhere}
  .empty{color:var(--faded);font-style:italic;padding:2rem 0;text-align:center}

  .fig{border-top:3px double var(--ink);padding-top:.8rem}
  .fig-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem .7rem}
  .fig-no{font-family:'IM Fell English',serif;font-size:1.3rem}
  .fig-bird{font-family:'IM Fell English SC',serif;letter-spacing:.16em;font-size:1rem}
  .fig-latin{font-style:italic;color:var(--faded);font-size:.85rem}
  .confidence{font:.72rem var(--mono);color:var(--faded);margin-left:auto}
  .lyric{text-align:center;font-family:'IM Fell English SC',serif;letter-spacing:.16em;
         font-size:.9rem;color:var(--blue-deep);margin:.65rem 0}
  .enc{font:0.82rem/1.5 var(--mono);background:var(--wash);border:1px solid var(--rule);
       padding:.55rem .7rem;white-space:pre-wrap;word-break:break-word;margin-top:.7rem}
  .fig-note{font-size:.78rem;font-style:italic;color:var(--faded);margin-top:.5rem}
  .row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-top:.7rem}
  .ov{font-size:.72rem;color:var(--faded);display:inline-flex;align-items:center;gap:.2rem}
  .ov input{width:4rem;border:1px solid var(--rule);background:var(--paper);padding:.15rem .25rem}
  .ov select{padding:.1rem}
  .note-now{font:.85rem var(--mono);color:var(--blue-deep);min-width:4ch}
  .todo-note{border:1px dashed var(--rule);color:var(--faded);padding:.7rem;margin-top:.7rem}

  .controls{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-wrap:wrap;
            gap:.6rem 1.4rem;align-items:center;justify-content:center;border-top:2px solid var(--ink);
            padding:.55rem 1rem;background:#f7f5eeF2;backdrop-filter:blur(3px);
            box-shadow:0 -3px 12px rgba(27,26,23,.08)}
  .ctl{display:flex;align-items:center;gap:.45rem;font-size:.75rem;letter-spacing:.1em;
       text-transform:uppercase;color:var(--faded)}
  .ctl output{font:0.85rem var(--mono);color:var(--ink);letter-spacing:0;text-transform:none}
  input[type=range]{accent-color:var(--blue);width:120px}
  .err{color:#8a2f1e;font:.85rem var(--mono);min-height:1.2em;margin-top:.5rem}

  @media(max-width:760px){
    body{padding-top:1.5rem}.layout{grid-template-columns:1fr}.catalog{grid-template-columns:1fr auto}
    .catalog label{grid-column:1/-1}.source{order:2}.fig{order:1}.controls{gap:.4rem .8rem}
  }
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Wood Notes Wild</h1>
  <div class="sub">Notations of Bird Music · 1892</div>
  <div class="credit" id="credit">Simeon Pease Cheney — loading corpus…</div>
</header>

<nav class="catalog" aria-label="Figure catalog">
  <label>Find a bird or figure
    <input id="search" type="search" placeholder="Robin, appendix, blue-01…" autocomplete="off">
  </label>
  <div class="nav">
    <button id="prev" type="button" aria-label="Previous figure">← Prev</button>
    <button id="next" type="button" aria-label="Next figure">Next →</button>
  </div>
  <div class="catalog-count" id="catalogCount" aria-live="polite"></div>
  <label style="grid-column:1/-1">Matching figures
    <select id="figureSelect" size="7" aria-label="Matching figures"></select>
  </label>
</nav>

<main class="layout">
  <section class="source" aria-labelledby="sourceTitle">
    <div class="source-head">
      <h2 id="sourceTitle">Original notation</h2>
      <span class="source-count" id="sourceCount"></span>
    </div>
    <div class="crop-list" id="cropList"><div class="empty">Select a figure to load its source crop.</div></div>
  </section>

  <section class="fig" id="figureCard" aria-live="polite">
    <div class="fig-head">
      <span class="fig-no" id="figureId"></span>
      <span class="fig-bird" id="figureBird"></span>
      <span class="fig-latin" id="figureMeta"></span>
      <span class="confidence" id="figureConfidence"></span>
    </div>
    <div class="lyric" id="figureLyric" hidden></div>
    <div class="enc" id="figureEncoding" hidden></div>
    <div class="todo-note" id="todoNote" hidden>Not yet transcribed. The source crop is available for the next transcription pass.</div>
    <div class="fig-note" id="figureNote" hidden></div>
    <div class="row">
      <button class="play" id="play" type="button">Play</button>
      <label class="ov">♩=<input type="number" id="figureTempo" min="30" max="240" placeholder="—"></label>
      <label class="ov">oct<select id="figureOct"><option value="">—</option><option>-2</option><option>-1</option><option value="0">0</option><option>+1</option><option>+2</option></select></label>
      <span class="note-now" id="noteNow"></span>
    </div>
    <div class="err" id="playerError"></div>
  </section>
</main>

<div class="controls">
  <div class="ctl">Tempo <input type="range" id="tempo" min="40" max="200" value="96"><output id="tempoOut">96 bpm</output></div>
  <div class="ctl">Octave <input type="range" id="octave" min="-2" max="2" value="0" step="1"><output id="octOut">+0</output></div>
  <div class="ctl">Timbre
    <select id="timbre"><option value="whistle">Whistle</option><option value="pure">Pure tone</option><option value="reed">Reed</option></select>
  </div>
  <div class="ctl">Slide
    <select id="slide"><option value="0">Off</option><option value="1">Bird glide</option></select>
  </div>
</div>

<script>
let ctx = null;
let figures = [];
let filtered = [];
let current = null;
let stopCurrent = null;
const $ = id => document.getElementById(id);
const MARK = {high:'high confidence',med:'medium confidence',low:'low confidence',todo:'not transcribed',dup:'retired duplicate'};
const NOTE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};

function audio(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
function freq(tok,octShift){
  const m=tok.match(/^([A-Ga-g])([#b]{0,2})(\d)$/); if(!m)return null;
  let semis=NOTE[m[1].toUpperCase()]; for(const a of m[2])semis+=a==='#'?1:-1;
  const midi=(parseInt(m[3])+1+octShift)*12+semis;
  return 440*Math.pow(2,(midi-69)/12);
}
function parse(enc){
  const events=[];
  for(const raw of enc.trim().split(/\s+/)){
    if(raw==='|'||raw==='')continue;
    const parts=raw.split(':'); if(parts.length!==2)throw new Error(`bad token "${raw}"`);
    const [p,dRaw]=parts; let d=dRaw,mult=1;
    if(d.endsWith('^')){mult*=1.7;d=d.slice(0,-1)}
    if(d.endsWith('.')){mult*=1.5;d=d.slice(0,-1)}
    let trip=false;if(d.endsWith('3')&&d.length>1){trip=true;d=d.slice(0,-1)}
    const base=parseInt(d);if(![1,2,4,8,16,32].includes(base))throw new Error(`bad duration in "${raw}"`);
    let beats=4/base*mult;if(trip)beats*=2/3;
    if(/^r$/i.test(p))events.push({rest:true,beats,label:raw});
    else{if(!/^[A-Ga-g][#b]{0,2}\d$/.test(p))throw new Error(`bad pitch in "${raw}"`);events.push({pitch:p,beats,label:p})}
  }
  if(!events.length)throw new Error('no notes');return events;
}
async function playSeq(){
  $('playerError').textContent='';
  let events;try{events=parse(current.enc)}catch(e){$('playerError').textContent=e.message;return}
  if(stopCurrent)stopCurrent();
  let stopped=false;const ac=audio();if(ac.state==='suspended')await ac.resume();
  const localTempo=+$('figureTempo').value;
  const bpm=localTempo||+$('tempo').value;
  const localOct=$('figureOct').value;
  const octShift=localOct===''?+$('octave').value:+localOct;
  const timbre=$('timbre').value,glide=$('slide').value==='1',spb=60/bpm;
  const master=ac.createGain();master.gain.value=.25;master.connect(ac.destination);
  const btn=$('play');btn.classList.add('playing');btn.textContent='Stop';
  stopCurrent=()=>{stopped=true;master.disconnect();finish()};
  btn.onclick=stopCurrent;
  let t=ac.currentTime+.06,prevFreq=null;
  for(const ev of events){
    const dur=ev.beats*spb;
    if(!ev.rest){
      const f=freq(ev.pitch,octShift),o=ac.createOscillator(),g=ac.createGain(),filter=ac.createBiquadFilter();
      o.type=timbre==='reed'?'sawtooth':timbre==='pure'?'sine':'triangle';
      filter.type='lowpass';filter.frequency.value=timbre==='whistle'?f*3:timbre==='reed'?f*4:12000;
      o.connect(filter);filter.connect(g);g.connect(master);
      if(glide&&prevFreq){o.frequency.setValueAtTime(prevFreq,t);o.frequency.exponentialRampToValueAtTime(f,t+Math.min(.06,dur*.3))}
      else o.frequency.setValueAtTime(f,t);
      const attack=.012,release=Math.min(.08,dur*.35);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+attack);
      g.gain.setValueAtTime(1,t+dur-release);g.gain.linearRampToValueAtTime(.0001,t+dur);
      o.start(t);o.stop(t+dur+.02);prevFreq=f;
    }
    t+=dur;
  }
  const total=(t-ac.currentTime)*1000,start=performance.now();let index=0,elapsed=0;
  const marks=events.map(ev=>(elapsed+=ev.beats*spb*1000,elapsed));
  function tick(){
    if(stopped)return;const passed=performance.now()-start;
    while(index<events.length&&passed>marks[index])index++;
    $('noteNow').textContent=index<events.length?events[index].label:'';
    if(passed<total)requestAnimationFrame(tick);else finish();
  }
  requestAnimationFrame(tick);
  function finish(){
    btn.classList.remove('playing');btn.textContent='Play';btn.onclick=playSeq;$('noteNow').textContent='';stopCurrent=null;
  }
}
function optionLabel(f){return `${f.bird||'Unknown'} — ${f.id} — p. ${f.page??'?'} [${f.conf||'todo'}]`}
function applyFilter(){
  const q=$('search').value.trim().toLowerCase();
  filtered=figures.filter(f=>!q||[f.id,f.bird,f.note,f.lyric,f.conf].some(v=>String(v||'').toLowerCase().includes(q)));
  $('figureSelect').replaceChildren(...filtered.map(f=>{
    const o=document.createElement('option');o.value=f.id;o.textContent=optionLabel(f);return o;
  }));
  $('catalogCount').textContent=`${filtered.length} of ${figures.length} figures`;
  if(current&&filtered.some(f=>f.id===current.id))$('figureSelect').value=current.id;
  else if(filtered.length)selectFigure(filtered[0].id);
}
function selectFigure(id){
  const f=figures.find(item=>item.id===id);if(!f)return;
  if(stopCurrent)stopCurrent();current=f;$('figureSelect').value=f.id;
  $('figureId').textContent=f.id;$('figureBird').textContent=f.bird||'Unknown';
  $('figureMeta').textContent=`p. ${f.page??'?'}${f.key&&f.key!=='?'?` · ${f.key}`:''}`;
  $('figureConfidence').textContent=MARK[f.conf]||f.conf||'unrated';
  $('figureLyric').textContent=f.lyric||'';$('figureLyric').hidden=!f.lyric;
  $('figureEncoding').textContent=f.enc||'';$('figureEncoding').hidden=!f.enc;
  $('todoNote').hidden=!!f.enc;$('figureNote').textContent=f.note||'';$('figureNote').hidden=!f.note;
  $('figureTempo').value=f.tempo||'';$('figureOct').value='';
  $('play').disabled=!f.enc;$('play').onclick=f.enc?playSeq:null;
  const crops=Array.isArray(f.crops)?f.crops:[];
  $('sourceCount').textContent=crops.length?`${crops.length} crop${crops.length===1?'':'s'}`:'';
  if(!crops.length)$('cropList').innerHTML='<div class="empty">No crop is linked to this catalog entry.</div>';
  else{
    $('cropList').replaceChildren(...crops.map((src,index)=>{
      const figure=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');
      img.src=src;img.alt=`Original notation crop ${index+1} for ${f.bird||f.id}`;img.loading='lazy';
      cap.textContent=src;figure.append(img,cap);return figure;
    }));
  }
  const url=new URL(location.href);url.searchParams.set('figure',f.id);history.replaceState(null,'',url);
}
function move(delta){
  if(!filtered.length)return;const index=Math.max(0,filtered.findIndex(f=>current&&f.id===current.id));
  selectFigure(filtered[(index+delta+filtered.length)%filtered.length].id);
}
async function init(){
  try{
    const response=await fetch('corpus.json');if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const corpus=await response.json();figures=corpus.figures.filter(f=>f.conf!=='dup');
    const playable=figures.filter(f=>f.enc).length;
    $('credit').textContent=`Simeon Pease Cheney — ${playable} playable / ${figures.length} active catalogued · ~ = verify by ear, ?? = low confidence`;
    applyFilter();
    const requested=new URL(location.href).searchParams.get('figure');
    selectFigure(figures.some(f=>f.id===requested)?requested:(figures.find(f=>f.enc)||figures[0]).id);
  }catch(error){
    $('credit').textContent='Could not load corpus.json';
    $('playerError').textContent=`Serve this directory over HTTP to use the player: ${error.message}`;
  }
}
$('search').addEventListener('input',applyFilter);
$('figureSelect').addEventListener('change',e=>selectFigure(e.target.value));
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
$('tempo').addEventListener('input',e=>$('tempoOut').textContent=e.target.value+' bpm');
$('octave').addEventListener('input',e=>$('octOut').textContent=(e.target.value>=0?'+':'')+e.target.value);
init();
</script>
</body>
</html>
